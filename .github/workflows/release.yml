name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check version matches the tag
        shell: bash
        run: node scripts/sync-version.mjs --check --expect="${{ github.ref_name }}"

      - name: Check the release notes exist
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "release-notes/${version}.md" ]; then
            echo "::error::missing release-notes/${version}.md for ${{ github.ref_name }}"
            exit 1
          fi

      - name: Read the build number
        id: build
        shell: bash
        run: |
          build="$(grep -oE 'BUILD_NUMBER = [0-9]+' src/lib/build.ts | grep -oE '[0-9]+')"
          echo "number=$build" >> "$GITHUB_OUTPUT"
          echo "building version ${GITHUB_REF_NAME} build $build"

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "body<<EOF"
            cat "release-notes/${version}.md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: trove ${{ github.ref_name }} build ${{ steps.build.outputs.number }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # Our own manifest is the only one, so the action must not upload its own.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: false

      - name: Publish the MSI, the setup exe and the portable build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "no MSI produced" }
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $msi.FullName "trove-setup.msi"
          if ($nsis) { Copy-Item $nsis.FullName "trove-setup.exe" }
          Compress-Archive -Path "src-tauri/target/release/trove.exe" -DestinationPath "trove-portable-x64.zip" -Force
          $assets = @("trove-setup.msi", "trove-portable-x64.zip")
          if ($nsis) { $assets += "trove-setup.exe" }
          gh release upload "${{ github.ref_name }}" $assets --clobber

      - name: Publish the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          # The MSI is what the updater installs; its signature travels with it.
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "no MSI produced" }
          node scripts/updater-json.mjs --tag=$tag --installer="$($msi.FullName)" --signature="$($msi.FullName).sig" --notes="release-notes/${version}.md"
          gh release upload $tag latest.json --clobber
